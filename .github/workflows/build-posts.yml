name: Build posts from the editor

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "images/uploads/**"
      - "tools/**"
      - ".github/workflows/build-posts.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml pillow

      - run: python tools/build_posts.py

      - name: Commit the built pages
        id: commit
        run: |
          git config user.name "miles-away-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A posts images/uploads index.html archive.html gear.html tips.html destinations.html sitemap.xml content/LINKS-TO-TRACK.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish posts from the editor"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the workflow token don't start a Pages build on their own
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
